# Runs on every push/PR to main. Deliberately only runs the
# deterministic tests (sudoku_core) so CI never needs a Groq API key
# as a GitHub secret and never costs anything to run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint
        run: ruff check . --ignore E501

      - name: Run core tests
        run: pytest tests/test_sudoku_core.py -v
